# Da includere nella configurazione nginx esistente (es. /etc/nginx/sites-available/jarai-molfino).
# Certificato: certbot --nginx -d molfino.jarai.botcom.it
server {
    listen 443 ssl;
    http2 on;
    server_name molfino.jarai.botcom.it;

    # ssl_certificate / ssl_certificate_key: li aggiunge certbot.

    client_max_body_size 200m;          # caricamento documenti delle pratiche

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;     # WebSocket del protocollo
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;                      # turni lunghi dell'agente
    }
}
